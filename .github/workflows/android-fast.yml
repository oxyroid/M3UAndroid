name: Android Fast Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Verify fast contracts
        run: |
          ./gradlew \
            :extension:api:jvmTest \
            :extension:conformance:test \
            :extension:runtime:test \
            :extension:transport-protocol-android:testDebugUnitTest \
            :extension:sdk-android:testDebugUnitTest \
            :app:smartphone:testDebugUnitTest \
            :i18n:testDebugUnitTest

      - name: Verify extension SDK distribution
        run: testing/bin/verify-extension-sdk-distribution.sh

      - name: Build debug APKs
        run: |
          ./gradlew \
            :app:smartphone:assembleDebug \
            :app:tv:assembleDebug \
            :testing:extension-reference:assembleDebug

      - name: Verify debug default library packaging
        run: |
          testing/bin/verify-smartphone-default-library-assets.sh \
            debug \
            app/smartphone/build/outputs/apk/debug/*.apk

      - name: Verify 16 KB native compatibility
        run: |
          testing/bin/verify-android-16kb.sh \
            app/smartphone/build/outputs/apk/debug/*.apk \
            app/tv/build/outputs/apk/debug/*.apk \
            testing/extension-reference/build/outputs/apk/debug/*.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          if-no-files-found: error
          retention-days: 14
          path: |
            build/distributions/m3u-extension-sdk-*
            app/smartphone/build/outputs/apk/debug/*.apk
            app/tv/build/outputs/apk/debug/*.apk
            testing/extension-reference/build/outputs/apk/debug/*.apk

      - name: Upload To Telegram
        uses: xireiki/channel-post@890c1d09635ae629aeffbed4f9716a5473eac896 # v1.0.10
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          api_id: ${{ secrets.API_ID }}
          api_hash: ${{ secrets.API_HASH }}
          large_file: true
          method: sendFile
          path: |
            build/distributions/m3u-extension-sdk-*
            app/smartphone/build/outputs/apk/debug/*.apk
            app/tv/build/outputs/apk/debug/*.apk
            testing/extension-reference/build/outputs/apk/debug/*.apk
