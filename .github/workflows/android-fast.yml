name: Android Fast Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: zulu

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      - name: Build debug APKs
        run: |
          ./gradlew \
            :app:smartphone:assembleDebug \
            :app:tv:assembleDebug \
            :testing:extension-reference:assembleDebug

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: android-debug-apks
          if-no-files-found: error
          retention-days: 14
          path: |
            app/smartphone/build/outputs/apk/debug/*.apk
            app/tv/build/outputs/apk/debug/*.apk
            testing/extension-reference/build/outputs/apk/debug/*.apk

      - name: Upload To Telegram
        uses: xireiki/channel-post@079e0dacc9864ede0424c7bbf331467ecb8e087f # v2.0.4
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          api_id: ${{ secrets.API_ID }}
          api_hash: ${{ secrets.API_HASH }}
          cache_session: false
          large_file: true
          method: sendFile
          path: |
            app/smartphone/build/outputs/apk/debug/*.apk
            app/tv/build/outputs/apk/debug/*.apk
            testing/extension-reference/build/outputs/apk/debug/*.apk
