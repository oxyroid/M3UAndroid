name: Android CI

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.idea/**'
      - 'fastlane/**'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Build and publish signed Release artifacts
        required: true
        default: false
        type: boolean

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "zulu"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      - name: Run unit tests
        run: |
          ./gradlew \
            :extension:api:jvmTest \
            :extension:conformance:test \
            :extension:runtime:test \
            :app:smartphone:testDebugUnitTest \
            :i18n:testDebugUnitTest

      - name: Enable KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "/dev/kvm is not available on this runner"
            exit 1
          fi
          sudo chown root:$(id -gn) /dev/kvm
          sudo chmod 660 /dev/kvm

      - name: Start provider mock server
        run: |
          ./gradlew :testing:mock-server:startMockServer
          curl \
            --fail \
            --silent \
            --show-error \
            --noproxy '*' \
            --retry 20 \
            --retry-connrefused \
            --retry-delay 1 \
            --max-time 2 \
            http://127.0.0.1:8080/health

      - name: Run extension and provider device tests
        run: |
          ./gradlew :app:smartphone:hostileApi34DebugAndroidTest \
            -Pm3uMockServerUrl=http://10.0.2.2:8080 \
            -Pm3uUseTestOrchestrator=true \
            -Pandroid.testInstrumentationRunnerArguments.class=com.m3u.testing.HostileExternalExtensionIpcTest,com.m3u.testing.ExternalExtensionConformanceIpcTest,com.m3u.testing.ExternalProviderEndToEndTest,com.m3u.testing.DebugDefaultLibraryBootstrapTest,com.m3u.testing.ExternalProviderColdStartSessionRecoveryTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true \
            -Pandroid.experimental.androidTest.numManagedDeviceShards=1 \
            -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1

      - name: Stop provider mock server
        if: always()
        run: ./gradlew :testing:mock-server:stopMockServer

      - name: Upload managed device test reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          if-no-files-found: warn
          path: |
            app/smartphone/build/outputs/androidTest-results/managedDevice/**
            app/smartphone/build/reports/androidTests/managedDevice/**
            testing/mock-server/build/mock-server/mock-server.log

  pr_release:
    if: github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "zulu"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      - name: Build unsigned Release APKs
        run: |
          ./gradlew \
            :app:smartphone:assembleRelease \
            :app:tv:assembleRelease \
            :testing:extension-reference:assembleRelease

  release_build:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish_release)
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "zulu"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      - name: Prepare stable release signing
        env:
          M3U_APP_RELEASE_KEYSTORE_BASE64: ${{ secrets.M3U_APP_RELEASE_KEYSTORE_BASE64 }}
          M3U_APP_RELEASE_STORE_PASSWORD: ${{ secrets.M3U_APP_RELEASE_STORE_PASSWORD }}
          M3U_APP_RELEASE_KEY_ALIAS: ${{ secrets.M3U_APP_RELEASE_KEY_ALIAS }}
          M3U_APP_RELEASE_KEY_PASSWORD: ${{ secrets.M3U_APP_RELEASE_KEY_PASSWORD }}
          M3U_REFERENCE_EXTENSION_RELEASE_KEYSTORE_BASE64: ${{ secrets.M3U_REFERENCE_EXTENSION_RELEASE_KEYSTORE_BASE64 }}
          M3U_REFERENCE_EXTENSION_RELEASE_STORE_PASSWORD: ${{ secrets.M3U_REFERENCE_EXTENSION_RELEASE_STORE_PASSWORD }}
          M3U_REFERENCE_EXTENSION_RELEASE_KEY_ALIAS: ${{ secrets.M3U_REFERENCE_EXTENSION_RELEASE_KEY_ALIAS }}
          M3U_REFERENCE_EXTENSION_RELEASE_KEY_PASSWORD: ${{ secrets.M3U_REFERENCE_EXTENSION_RELEASE_KEY_PASSWORD }}
          M3U_REFERENCE_EXTENSION_EXPECTED_CERT_SHA256: ${{ vars.M3U_REFERENCE_EXTENSION_EXPECTED_CERT_SHA256 }}
        run: testing/bin/prepare-release-signing.sh "${{ github.event_name }}"

      - name: Build signed release artifacts
        run: |
          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            verifyExtensionSdkBundle \
            :app:smartphone:assembleRelease \
            :app:tv:assembleRelease \
            :testing:extension-reference:assembleRelease

      - name: Verify release default library packaging
        run: |
          testing/bin/verify-smartphone-default-library-assets.sh \
            release \
            app/smartphone/build/outputs/published-apk/release/*.apk

      - name: Verify release APK certificates
        run: |
          testing/bin/verify-release-apk-signing.sh \
            app/smartphone/build/outputs/published-apk/release/*.apk \
            app/tv/build/outputs/published-apk/release/*.apk \
            testing/extension-reference/build/outputs/apk/release/*.apk

      - name: Verify 16 KB native compatibility
        run: |
          testing/bin/verify-android-16kb.sh \
            app/smartphone/build/outputs/published-apk/release/*.apk \
            app/tv/build/outputs/published-apk/release/*.apk \
            testing/extension-reference/build/outputs/apk/release/*.apk

      - name: Remove release signing material
        if: always()
        shell: bash
        run: |
          app_keystore="${ORG_GRADLE_PROJECT_m3uAppReleaseStoreFile:-}"
          reference_keystore="${ORG_GRADLE_PROJECT_m3uReferenceExtensionReleaseStoreFile:-}"
          if [[ -n "$app_keystore" || -n "$reference_keystore" ]]; then
            app_signing_directory="$(dirname "$app_keystore")"
            reference_signing_directory="$(dirname "$reference_keystore")"
            if [[ \
              -z "$app_keystore" ||
              -z "$reference_keystore" ||
              "$app_signing_directory" != "$reference_signing_directory" ||
              "$app_signing_directory" != "$RUNNER_TEMP"/m3u-release-signing.* \
            ]]; then
              echo "Refusing to clean an unexpected release signing path." >&2
              exit 1
            fi
            rm -f -- "$app_keystore" "$reference_keystore"
            rmdir "$app_signing_directory"
          fi
          {
            echo "ORG_GRADLE_PROJECT_m3uReleaseSigningRequired="
            echo "ORG_GRADLE_PROJECT_m3uAppReleaseStoreFile="
            echo "ORG_GRADLE_PROJECT_m3uAppReleaseStorePassword="
            echo "ORG_GRADLE_PROJECT_m3uAppReleaseKeyAlias="
            echo "ORG_GRADLE_PROJECT_m3uAppReleaseKeyPassword="
            echo "ORG_GRADLE_PROJECT_m3uReferenceExtensionReleaseStoreFile="
            echo "ORG_GRADLE_PROJECT_m3uReferenceExtensionReleaseStorePassword="
            echo "ORG_GRADLE_PROJECT_m3uReferenceExtensionReleaseKeyAlias="
            echo "ORG_GRADLE_PROJECT_m3uReferenceExtensionReleaseKeyPassword="
            echo "M3U_APP_EXPECTED_CERT_SHA256="
            echo "M3U_REFERENCE_EXTENSION_EXPECTED_CERT_SHA256="
          } >> "$GITHUB_ENV"

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: android-release-artifacts
          if-no-files-found: error
          path: |
            build/distributions/m3u-extension-sdk-*
            app/smartphone/build/outputs/published-apk/release/*.apk
            app/tv/build/outputs/published-apk/release/*.apk
            testing/extension-reference/build/outputs/apk/release/*.apk

  publish:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish_release)
    needs: release_build
    runs-on: ubuntu-latest

    steps:
      - name: Download signed release artifacts
        uses: actions/download-artifact@v7
        with:
          name: android-release-artifacts
          path: release-artifacts

      - name: Upload To Telegram
        uses: xireiki/channel-post@079e0dacc9864ede0424c7bbf331467ecb8e087f # v2.0.4
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          api_id: ${{ secrets.API_ID }}
          api_hash: ${{ secrets.API_HASH }}
          cache_session: false
          large_file: true
          method: sendFile
          path: |
            release-artifacts/build/distributions/m3u-extension-sdk-*
            release-artifacts/app/smartphone/build/outputs/published-apk/release/*.apk
            release-artifacts/app/tv/build/outputs/published-apk/release/*.apk
            release-artifacts/testing/extension-reference/build/outputs/apk/release/*.apk
