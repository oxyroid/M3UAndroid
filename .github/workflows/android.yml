name: Android CI

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - '.idea/**'
      - 'fastlane/**'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: "zulu"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Clean GMD
        run: ./gradlew cleanManagedDevices --unused-only

      - name: Enable KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "/dev/kvm is not available on this runner"
            exit 1
          fi
          sudo chown root:$(id -gn) /dev/kvm
          sudo chmod 660 /dev/kvm
          ls -l /dev/kvm

      - name: Verify extension contracts
        run: |
          ./gradlew \
            :extension:api:jvmTest \
            :extension:conformance:test \
            :extension:runtime:test \
            :extension:transport-protocol-android:testDebugUnitTest \
            :extension:sdk-android:testDebugUnitTest \
            :extension:transport-android:testDebugUnitTest

      - name: Verify extension SDK distribution
        run: testing/bin/verify-extension-sdk-distribution.sh

      - name: Verify localization contracts
        run: |
          ./gradlew \
            :app:smartphone:testDebugUnitTest \
            :i18n:testDebugUnitTest

      - name: Validate connected UI harnesses
        run: |
          bash -n testing/bin/run-smartphone-provider-ui-matrix.sh
          ./gradlew \
            :data:assembleDebugAndroidTest \
            :app:smartphone:assembleDebugAndroidTest \
            :app:tv:assembleDebugAndroidTest

      - name: Start provider mock server
        run: |
          ./gradlew :testing:mock-server:startMockServer
          curl \
            --fail \
            --silent \
            --show-error \
            --noproxy '*' \
            --retry 20 \
            --retry-connrefused \
            --retry-delay 1 \
            --max-time 2 \
            http://127.0.0.1:8080/health

      - name: Verify external extension isolation, conformance, and provider lifecycle
        run: |
          ./gradlew :app:smartphone:hostileApi34DebugAndroidTest \
            -Pm3uMockServerUrl=http://10.0.2.2:8080 \
            -Pandroid.testInstrumentationRunnerArguments.class=com.m3u.testing.HostileExternalExtensionIpcTest,com.m3u.testing.ExternalExtensionConformanceIpcTest,com.m3u.testing.ExternalProviderEndToEndTest,com.m3u.testing.DebugDefaultLibraryBootstrapTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true \
            -Pandroid.experimental.androidTest.numManagedDeviceShards=1 \
            -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1

      - name: Stop provider mock server
        if: always()
        run: ./gradlew :testing:mock-server:stopMockServer

      - name: Upload managed device test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: warn
          path: |
            app/smartphone/build/outputs/androidTest-results/managedDevice/**
            app/smartphone/build/reports/androidTests/managedDevice/**
            testing/mock-server/build/mock-server/mock-server.log

      - name: Build smartphone release APK
        run: ./gradlew :app:smartphone:assembleRelease

      - name: Verify release default library packaging
        run: |
          testing/bin/verify-smartphone-default-library-assets.sh \
            release \
            app/smartphone/build/outputs/published-apk/release/*.apk

      - name: Build TV release APK
        run: ./gradlew :app:tv:assembleRelease

      - name: Build reference extension release APK
        run: ./gradlew :testing:extension-reference:assembleRelease

      - name: Verify 16 KB native compatibility
        run: |
          testing/bin/verify-android-16kb.sh \
            app/smartphone/build/outputs/published-apk/release/*.apk \
            app/tv/build/outputs/published-apk/release/*.apk \
            testing/extension-reference/build/outputs/apk/release/*.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          path: |
            build/distributions/m3u-extension-sdk-*
            app/smartphone/build/outputs/published-apk/release/*.apk
            app/tv/build/outputs/published-apk/release/*.apk
            testing/extension-reference/build/outputs/apk/release/*.apk

      - name: Upload To Telegram
        if: github.event_name != 'pull_request'
        uses: xireiki/channel-post@890c1d09635ae629aeffbed4f9716a5473eac896 # v1.0.10
        with:
          bot_token: ${{ secrets.BOT_TOKEN }}
          chat_id: ${{ secrets.CHAT_ID }}
          api_id: ${{ secrets.API_ID }}
          api_hash: ${{ secrets.API_HASH }}
          large_file: true
          method: sendFile
          path: |
            build/distributions/m3u-extension-sdk-*
            app/smartphone/build/outputs/published-apk/release/*.apk
            app/tv/build/outputs/published-apk/release/*.apk
            testing/extension-reference/build/outputs/apk/release/*.apk
